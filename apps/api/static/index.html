<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f2eb" />
    <title>RedBeauty · 美妆素材管理平台</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/ux.css" />
    <link rel="stylesheet" href="/static/redbeauty.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <aside class="prototype-nav" aria-label="主导航">
      <a class="prototype-brand" href="/" aria-label="RedBeauty 素材首页">
        <span class="prototype-brand-mark">R</span>
        <span class="prototype-brand-name">RedBeauty</span>
      </a>
      <nav class="prototype-nav-list" aria-label="素材平台导航">
        <a id="home-nav" class="prototype-nav-item active" href="/" aria-current="page"><span aria-hidden="true">⌂</span><b>主页</b></a>
        <button id="favorites-nav" class="prototype-nav-item" type="button" title="查看我喜欢的素材"><span aria-hidden="true">♡</span><b>喜欢</b></button>
        <button class="prototype-nav-item" type="button" title="搜索页面将在下一轮接入"><span aria-hidden="true">⌕</span><b>搜索</b></button>
        <button class="prototype-nav-item" type="button" title="标签管理将在下一轮接入"><span aria-hidden="true">＋</span><b>标签</b></button>
      </nav>
      <div class="prototype-user" title="当前用户"><span>W</span><b>王</b></div>
    </aside>
    <header class="topbar">
      <a class="brand" href="/" aria-label="回到素材库首页">
        <span class="brand-mark">X</span>
        <span><b>XVI</b><small>Visual Intelligence</small></span>
      </a>
      <div class="feed-tabs" aria-label="素材排序视图">
        <button class="feed-tab active" type="button">全部</button>
        <button class="feed-tab" type="button">趋势</button>
        <button class="feed-tab" type="button">最近</button>
      </div>
      <label class="search-box" for="search-input">
        <span aria-hidden="true">⌕</span>
        <input id="search-input" type="search" placeholder="搜索品牌、关键词或作者" autocomplete="off" />
        <kbd>⌘ K</kbd>
      </label>
      <div class="topbar-meta"><span class="live-dot"></span> 本地素材库</div>
    </header>

    <main class="layout">
      <aside id="filter-sidebar" class="sidebar" aria-label="筛选条件">
        <div class="side-heading">
          <span>浏览素材</span>
          <div class="side-actions"><button id="reset-filters" class="text-button" type="button">重置</button><button id="close-filters" class="icon-button-inline" type="button" aria-label="关闭筛选">×</button></div>
        </div>
        <section class="filter-section">
          <p class="filter-label">推送状态</p>
          <label class="switch-row"><input id="only-new" type="checkbox" /><span class="switch"></span><span>仅看未推送</span></label>
        </section>
        <section class="filter-section">
          <p class="filter-label">合规进度</p>
          <div id="status-filters" class="filter-stack">
            <button data-status="" class="filter-button active"><span class="filter-bullet all"></span>全部素材</button>
            <button data-status="eligible" class="filter-button"><span class="filter-bullet eligible"></span>满足推送阈值</button>
            <button data-status="needs_review" class="filter-button"><span class="filter-bullet review"></span>待复核</button>
            <button data-status="below_threshold" class="filter-button"><span class="filter-bullet below"></span>未达阈值</button>
          </div>
        </section>
        <section class="filter-section tags-section">
          <p class="filter-label">检索标签</p>
          <label class="tag-search" for="tag-search-input"><span aria-hidden="true">⌕</span><input id="tag-search-input" type="search" placeholder="查找标签" autocomplete="off" /></label>
          <div id="tag-filters" class="tag-list" aria-live="polite"></div>
          <button id="toggle-tags" class="text-button tag-toggle" type="button" hidden>显示更多标签</button>
        </section>
        <p class="sidebar-footnote">素材仅来自已入库的采集结果；页面不会主动访问小红书。</p>
        <button id="apply-mobile-filters" class="primary-button mobile-apply-button" type="button">查看筛选结果</button>
      </aside>
      <button id="filter-backdrop" class="filter-backdrop" type="button" aria-label="关闭筛选" hidden></button>

      <section class="content">
        <div id="active-filters" class="active-filters" aria-live="polite"></div>
        <section id="masonry" class="masonry" aria-live="polite"></section>
        <div id="empty-state" class="empty-state" hidden>
          <span>◇</span><h2>没有匹配的笔记</h2><p>试试清除筛选或改用更短的关键词。</p>
        </div>
        <nav id="pagination" class="pagination" aria-label="素材分页" hidden>
          <button id="page-previous" class="pagination-arrow" type="button" data-page="1">上一页</button>
          <div id="page-numbers" class="page-numbers" aria-live="polite"></div>
          <button id="page-next" class="pagination-arrow" type="button" data-page="1">下一页</button>
        </nav>
      </section>
    </main>

    <dialog id="note-dialog" class="note-dialog">
      <div class="dialog-shell">
        <button id="close-dialog" class="icon-button" aria-label="关闭详情">×</button>
        <div id="dialog-content" class="dialog-content"></div>
      </div>
    <div id="image-viewer" class="image-viewer" hidden role="dialog" aria-modal="true" aria-label="查看大图">
      <button id="close-image-viewer" class="viewer-close" type="button" aria-label="关闭大图">×</button>
      <button id="previous-image" class="viewer-nav previous" type="button" aria-label="上一张图片">‹</button>
      <img id="viewer-image" alt="素材大图" />
      <p id="viewer-caption"></p>
      <button id="next-image" class="viewer-nav next" type="button" aria-label="下一张图片">›</button>
    </div>
    <button id="back-to-top" class="back-to-top" type="button" aria-label="回到顶部" hidden>↑</button>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"><span id="toast-message"></span><button id="toast-action" type="button" hidden></button></div>
    <script type="module" src="/static/library.js"></script>
  </body>
</html>
