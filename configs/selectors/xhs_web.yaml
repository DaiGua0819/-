version: 1.2.0
source: xhs_web
selectors:
  login_required:
    required: false
    candidates:
      - text_regex: "登录|Log in|扫码登录|手机号登录"
  authenticated_marker:
    required: false
    candidates:
      - css: "[data-xvi-authenticated='true']"
      - css: "a[href*='/user/profile/']"
  search_input:
    candidates:
      - css: "#search-input"
      - css: "#search-input-in-feeds"
  filter_button:
    required: false
    candidates:
      - css: "div.filter"
      - text_regex: "^筛选$|^已筛选$"
  result_card:
    candidates:
      - css: "section.note-item"
      - css: "div.note-item"
      - css: "[data-xvi='result-card']"
      - css: "a[href*='/explore/']"
      - css: "a[href*='/search_result/']"
  note_author_link:
    required: false
    candidates:
      - css: "a.author[href*='/user/profile/']"
      - css: "a[href*='/user/profile/']"
  note_author_name:
    required: false
    candidates:
      - css: "span.username"
  note_container:
    candidates:
      - css: "[data-xvi='note-container']"
      - css: ".note-container"
  note_video:
    required: false
    candidates:
      - css: "[data-xvi='note-video']"
      - css: ".note-container video"
  note_title:
    required: false
    candidates:
      - css: "#detail-title"
  note_body:
    required: false
    candidates:
      - css: "#detail-desc > span.note-text > span:nth-of-type(1)"
      - css: "#detail-desc > span.note-text"
  note_tag:
    required: false
    candidates:
      - css: "#detail-desc a#hash-tag"
  note_edited_at:
    required: false
    candidates:
      - text_regex: "编辑于"
  carousel_viewport:
    candidates:
      - css: "[data-xvi='carousel-viewport']"
      - css: ".note-container .swiper-slide-active .note-slider-img"
  carousel_pagination:
    required: false
    candidates:
      - css: "[data-xvi='carousel-pagination']"
      - css: ".note-container .swiper-pagination-fraction"
      - css: ".note-container [class*='pagination'][class*='fraction']"
  carousel_next:
    required: false
    candidates:
      - css: ".arrow-controller.right:not(.forbidden)"
      - role: button
        name_regex: "下一张|Next"
      - css: "[data-xvi='carousel-next']"
  carousel_download:
    required: false
    candidates:
      - role: button
        name_regex: "下载|Download|保存图片|Save"
      - css: "[data-xvi='carousel-download']"
  note_close:
    required: false
    candidates:
      - role: button
        name_regex: "关闭|Close"
      - css: "[data-xvi='note-close']"
