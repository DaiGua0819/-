[project]
name = "xvi"
version = "0.1.0"
description = "XVI 授权浏览器图片采集服务"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "imagehash==4.3.2",
  "pillow==11.3.0",
  "playwright==1.54.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "pyyaml==6.0.2",
  "typer==0.16.0",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.8",
]

[project.scripts]
xvi = "xvi.cli:app"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
